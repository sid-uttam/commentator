name: Collect and rebuild

# Every 30 minutes: fetch the private engine, collect news / YouTube / live chat for active events,
# rebuild the pages into docs/, and save the collected data back to the engine repo.
# While an event is live, a round stays on for up to 25 minutes recording live chat.
#
# Secrets (Settings > Secrets and variables > Actions):
#   ENGINE_TOKEN     fine-grained token with Contents: read and write on sid-uttam/commentator-engine
#   YOUTUBE_API_KEY  YouTube Data API v3 key (optional: without it, news only)
#   ANTHROPIC_API_KEY  Claude API key for AI briefings (optional: without it, no AI briefings)
#   GMAIL_APP_PASSWORD  Gmail app password for the weekly email (optional)
#   FIREBASE_SERVICE_ACCOUNT  Firebase service-account JSON, to read who's signed in for the weekly email (optional)

on:
  workflow_dispatch:
    inputs:
      brief_now:
        description: "Write AI briefings and suggestions now (ignore the timer)"
        type: boolean
        default: false
      email_now:
        description: "Send the weekly email now (still only to addresses in nudge.only while that's set)"
        type: boolean
        default: false
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: write   # lets a round queue the next one (see "next" below)

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q jinja2 pillow cryptography

      - name: Fetch the engine
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: |
          if [ -z "$ENGINE_TOKEN" ]; then echo "::error::ENGINE_TOKEN secret is missing"; exit 1; fi
          git clone -q --depth 20 "https://x-access-token:${ENGINE_TOKEN}@github.com/sid-uttam/commentator-engine.git" engine

      - name: Collect and build
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd engine
          python run.py --out ../docs ${{ inputs.brief_now && '--brief-now' || '' }}

      - name: Weekly email (Sundays from 9am Dubai)
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd engine
          python nudge.py --out ../docs ${{ inputs.email_now && '--force' || '' }}

      - name: Save collected data to the engine
        run: |
          cd engine
          git config user.name "commentator-bot"
          git config user.email "commentator-bot@users.noreply.github.com"
          git add events state
          if ! git diff --cached --quiet; then
            git commit -q -m "Collected data $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
          fi

      - name: Publish pages
        run: |
          git config user.name "commentator-bot"
          git config user.email "commentator-bot@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -q -m "Pages update $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
          fi

  # GitHub's own timer often skips scheduled runs on small repos (it fired once in 15 hours on 16-17 Nov).
  # So each round queues the next one itself, 30 minutes after it started. The schedule above stays as a backup
  # that restarts the chain if it ever breaks. If another round is already waiting, this one doesn't queue a second.
  next:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait, then queue the next round
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          started=$(gh api "repos/$REPO/actions/runs/$RUN_ID" -q .run_started_at)
          wait=$(( $(date -d "$started" +%s) + 1800 - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then echo "Next round in $((wait / 60)) minutes"; sleep "$wait"; fi
          waiting=$(gh api "repos/$REPO/actions/workflows/update.yml/runs?per_page=20" \
            -q "[.workflow_runs[] | select(.id != $RUN_ID and (.status == \"queued\" or .status == \"pending\" or .status == \"waiting\" or .status == \"requested\" or .status == \"in_progress\"))] | length")
          if [ "$waiting" -gt 0 ]; then echo "Another round is already waiting; not queuing a second."; exit 0; fi
          gh api -X POST "repos/$REPO/actions/workflows/update.yml/dispatches" -f ref=main
          echo "Queued the next round."
